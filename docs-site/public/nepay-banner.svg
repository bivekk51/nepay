<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#181820" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0a0a0c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="1"/>
    </radialGradient>

    <!-- Subtle Brand Glow behind N -->
    <radialGradient id="n-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c1d22" stroke-width="0.75" stroke-opacity="0.8"/>
    </pattern>

    <linearGradient id="white-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4D4D8"/>
    </linearGradient>

    <linearGradient id="silver-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#71717A"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="#0a0a0c" rx="16"/>
  <rect width="1200" height="360" fill="url(#bg-glow)" rx="16"/>
  <rect width="1200" height="360" fill="url(#grid)" rx="16" opacity="0.65"/>
  <rect width="1200" height="360" fill="none" stroke="#1c1d22" stroke-width="1.5" rx="16"/>

  <!-- Center Aura -->
  <circle cx="600" cy="130" r="140" fill="url(#n-aura)"/>

  <!-- Logo Mark (Centered) -->
  <g transform="translate(560, 60)">
    <svg width="80" height="80" viewBox="0 0 64 64" fill="none">
      <!-- Left Stream -->
      <path d="M 15 52 L 15 20 C 15 15.5 18 12 22.5 12 C 25.5 12 28.5 13.8 30.5 16.5 L 47 40"
            stroke="url(#white-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Knockout -->
      <path d="M 17 24 L 33.5 47.5 C 35.5 50.2 38.5 52 41.5 52 C 46 52 49 48.5 49 44 L 49 12"
            stroke="#0a0a0c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Right Stream -->
      <path d="M 17 24 L 33.5 47.5 C 35.5 50.2 38.5 52 41.5 52 C 46 52 49 48.5 49 44 L 49 12"
            stroke="url(#silver-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </g>

  <!-- Wordmark -->
  <text x="600" y="195" 
        text-anchor="middle"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="-0.04em" 
        fill="#FFFFFF">nepay</text>

  <!-- Tagline -->
  <text x="600" y="235" 
        text-anchor="middle"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" 
        font-weight="400" 
        letter-spacing="-0.01em" 
        fill="#A1A1AA">The unified developer SDK for Nepal payments • eSewa + Khalti</text>

  <!-- Pill Badges -->
  <g transform="translate(600, 275)">
    <!-- Badge 1: S2S Enforced -->
    <rect x="-240" y="0" width="145" height="28" rx="14" fill="#16171c" stroke="#22242b"/>
    <circle cx="-226" cy="14" r="3.5" fill="#10B981"/>
    <text x="-214" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#E4E4E7">S2S Verified</text>

    <!-- Badge 2: Integer Paisa -->
    <rect x="-80" y="0" width="160" height="28" rx="14" fill="#16171c" stroke="#22242b"/>
    <circle cx="-66" cy="14" r="3.5" fill="#6366F1"/>
    <text x="-54" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#E4E4E7">Integer Paisa Math</text>

    <!-- Badge 3: TypeScript Native -->
    <rect x="95" y="0" width="145" height="28" rx="14" fill="#16171c" stroke="#22242b"/>
    <circle cx="109" cy="14" r="3.5" fill="#3B82F6"/>
    <text x="121" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#E4E4E7">TypeScript Native</text>
  </g>
</svg>