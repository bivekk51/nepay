<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#181820" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0a0a0c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="n-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c1d22" stroke-width="0.75" stroke-opacity="0.8"/>
    </pattern>
    <linearGradient id="white-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4D4D8"/>
    </linearGradient>
    <linearGradient id="silver-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#71717A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0c"/>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.65"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#27272a" stroke-width="1.5" rx="16"/>

  <circle cx="600" cy="210" r="200" fill="url(#n-aura)"/>

  <!-- Logo Mark -->
  <g transform="translate(548, 120)">
    <svg width="104" height="104" viewBox="0 0 64 64" fill="none">
      <path d="M 15 52 L 15 20 C 15 15.5 18 12 22.5 12 C 25.5 12 28.5 13.8 30.5 16.5 L 47 40"
            stroke="url(#white-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 17 24 L 33.5 47.5 C 35.5 50.2 38.5 52 41.5 52 C 46 52 49 48.5 49 44 L 49 12"
            stroke="#0a0a0c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 17 24 L 33.5 47.5 C 35.5 50.2 38.5 52 41.5 52 C 46 52 49 48.5 49 44 L 49 12"
            stroke="url(#silver-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </g>

  <!-- Wordmark -->
  <text x="600" y="290" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="58" 
        font-weight="800" 
        letter-spacing="-0.04em" 
        fill="#FFFFFF">nepay</text>

  <!-- Tagline -->
  <text x="600" y="345" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="22" 
        font-weight="500" 
        letter-spacing="-0.01em" 
        fill="#E4E4E7">Unified Nepal Payment Gateway SDK</text>

  <!-- Subtitle -->
  <text x="600" y="385" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" 
        font-weight="400" 
        letter-spacing="-0.01em" 
        fill="#A1A1AA">eSewa (ePay v2) • Khalti (ePayment v2) • TypeScript Native</text>

  <!-- Badges -->
  <g transform="translate(600, 440)">
    <rect x="-270" y="0" width="155" height="34" rx="17" fill="#16171c" stroke="#27272a"/>
    <circle cx="-252" cy="17" r="4" fill="#10B981"/>
    <text x="-238" y="22" font-family="monospace" font-size="13" font-weight="500" fill="#E4E4E7">S2S Verified</text>

    <rect x="-95" y="0" width="190" height="34" rx="17" fill="#16171c" stroke="#27272a"/>
    <circle cx="-77" cy="17" r="4" fill="#6366F1"/>
    <text x="-63" y="22" font-family="monospace" font-size="13" font-weight="500" fill="#E4E4E7">Integer Paisa Math</text>

    <rect x="115" y="0" width="155" height="34" rx="17" fill="#16171c" stroke="#27272a"/>
    <circle cx="133" cy="17" r="4" fill="#3B82F6"/>
    <text x="147" y="22" font-family="monospace" font-size="13" font-weight="500" fill="#E4E4E7">Zero Leaks</text>
  </g>

  <!-- Footer URL -->
  <text x="600" y="555" 
        text-anchor="middle"
        font-family="monospace" 
        font-size="15" 
        letter-spacing="0.05em" 
        fill="#71717A">nepay.nepalbivek.com.np</text>
</svg>