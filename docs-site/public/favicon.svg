<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="n-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F4F5" />
    </linearGradient>
    <linearGradient id="n-silver" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4D4D8" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
    <linearGradient id="n-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E303B" />
      <stop offset="100%" stop-color="#1A1B22" />
    </linearGradient>
  </defs>

  <!-- Squircle Base for High Contrast on both Light & Dark Browser Tabs -->
  <rect width="64" height="64" rx="14" fill="#0A0A0C" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="url(#n-border)" stroke-width="1.5" />

  <!-- Centered Nepay Interlocking N Mark -->
  <g transform="translate(0, 0)">
    <!-- Left Gateway Pillar & Mountain Ridge Peak (Stroke A) -->
    <path d="M 17 50 
             L 17 21 
             C 17 16.5 20 13 24.5 13 
             C 27.5 13 30.5 14.8 32.5 17.5 
             L 47 38.5"
          stroke="url(#n-white)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Negative Space Knockout Mask for Interlocking Bridge -->
    <path d="M 19 25 
             L 33.5 46.5 
             C 35.5 49.2 38.5 51 41.5 51 
             C 46 51 49 47.5 49 43 
             L 49 14"
          stroke="#0A0A0C" 
          stroke-width="13.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Gateway Pillar & Unified Bridge (Stroke B) -->
    <path d="M 19 25 
             L 33.5 46.5 
             C 35.5 49.2 38.5 51 41.5 51 
             C 46 51 49 47.5 49 43 
             L 49 14"
          stroke="url(#n-silver)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>